<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RelayHub 控制台</title>
<style>
:root{
  --ink:#2c2f45; --ink-2:#5a5f7a; --ink-3:#8b90a8;
  --glass:rgba(255,255,255,.55);
  --glass-brd:rgba(255,255,255,.72);
  --line:rgba(120,120,170,.16);
  --grad:linear-gradient(135deg,#f087b5 0%,#a98bf5 100%);
  --ok:#2fa47a; --err:#e05560; --warn:#d9962b;
  --sh:0 10px 34px rgba(96,86,160,.13);
  --r:24px; --r-sm:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;background:#f4f5fb;
}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:linear-gradient(150deg,#fdf4f9 0%,#eef2fd 42%,#f5f1fd 72%,#eefaf7 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.62;will-change:transform}
.blob.b1{width:560px;height:560px;background:#ffc6dd;top:-180px;left:-140px;animation:drift 26s ease-in-out infinite}
.blob.b2{width:480px;height:480px;background:#bcd9ff;top:6%;right:-180px;animation:drift 32s ease-in-out infinite;animation-delay:-8s}
.blob.b3{width:440px;height:440px;background:#d3bdf8;bottom:-160px;left:24%;animation:drift 29s ease-in-out infinite;animation-delay:-14s}
.blob.b4{width:400px;height:400px;background:#b7f0e4;bottom:8%;right:12%;animation:drift 35s ease-in-out infinite;animation-delay:-20s}
@keyframes drift{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(38px,-46px,0) scale(1.07)}
  66%{transform:translate3d(-30px,32px,0) scale(.95)}
}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.16;
  background-image:radial-gradient(rgba(120,110,180,.5) .5px,transparent .5px);background-size:4px 4px}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-brd);
  border-radius:var(--r);
  box-shadow:var(--sh), inset 0 1px 0 rgba(255,255,255,.85);
}
button{
  font:inherit;cursor:pointer;color:var(--ink);
  padding:9px 18px;border-radius:999px;
  border:1px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 2px 10px rgba(96,86,160,.10), inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
  white-space:nowrap;
}
button:hover{transform:translateY(-1px);background:rgba(255,255,255,.88);box-shadow:0 6px 18px rgba(96,86,160,.16)}
button:active{transform:translateY(0)}
button.primary{background:var(--grad);border-color:transparent;color:#fff;font-weight:600;
  box-shadow:0 8px 22px rgba(180,120,220,.38), inset 0 1px 0 rgba(255,255,255,.35)}
button.primary:hover{background:var(--grad);box-shadow:0 12px 28px rgba(180,120,220,.46)}
button.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
button.danger{color:var(--err)}
button.sm{padding:5px 12px;font-size:12.5px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
input,select,textarea{
  font:inherit;width:100%;color:var(--ink);
  padding:10px 14px;border-radius:14px;
  border:1px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 2px rgba(96,86,160,.07);
  transition:border-color .16s ease, box-shadow .16s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(190,140,240,.8);
  box-shadow:0 0 0 4px rgba(200,150,245,.18), inset 0 1px 2px rgba(96,86,160,.05)}
input:disabled{opacity:.55;cursor:not-allowed}
input::placeholder{color:var(--ink-3)}
label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px;font-weight:500}
.wrap{max-width:1360px;margin:0 auto;padding:22px 22px 60px}
header.top{position:sticky;top:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 22px;margin:12px auto 0;max-width:1360px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16.5px;letter-spacing:-.2px}
.mark{width:26px;height:26px;border-radius:9px;background:var(--grad);position:relative;
  box-shadow:0 5px 14px rgba(180,120,220,.45), inset 0 1px 0 rgba(255,255,255,.5)}
.mark::after{content:"";position:absolute;inset:6px 6px auto 6px;height:6px;border-radius:4px;background:rgba(255,255,255,.55)}
.brand small{font-weight:500;color:var(--ink-3);font-size:12px;margin-left:2px}
.top-right{display:flex;align-items:center;gap:10px}
.chip{font-size:12.5px;color:var(--ink-2);padding:5px 13px;border-radius:999px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8)}
nav.tabs{display:flex;gap:8px;padding:14px 0 4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border-radius:999px;font-size:13.5px;padding:8px 18px;color:var(--ink-2)}
nav.tabs button.active{background:var(--grad);color:#fff;font-weight:600;border-color:transparent;
  box-shadow:0 8px 20px rgba(180,120,220,.34)}
main section{display:none;animation:fade .28s ease}
main section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{padding:20px 22px;margin-bottom:18px}
.card > h2{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.3px;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-head h2{margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:min(150px,100%)}
.gap{margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2}
.kpi .k{font-size:12px;color:var(--ink-3);margin-top:3px}
.scroll{overflow-x:auto;border-radius:var(--r-sm)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{text-align:left;padding:11px 12px;vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.4px;background:rgba(255,255,255,.42)}
th:first-child{border-radius:12px 0 0 12px}
th:last-child{border-radius:0 12px 12px 0}
tbody tr:hover{background:rgba(255,255,255,.42)}
td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--ink-2)}
.muted{color:var(--ink-3);font-size:12px}
.nowrap{white-space:nowrap}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid transparent}
.tag.ok{color:var(--ok);background:rgba(47,164,122,.12);border-color:rgba(47,164,122,.22)}
.tag.err{color:var(--err);background:rgba(224,85,96,.12);border-color:rgba(224,85,96,.22)}
.tag.warn{color:var(--warn);background:rgba(217,150,43,.13);border-color:rgba(217,150,43,.24)}
.tag.dim{color:var(--ink-3);background:rgba(139,144,168,.12);border-color:rgba(139,144,168,.2)}
.tag.acc{color:#8a5bd0;background:rgba(160,110,240,.13);border-color:rgba(160,110,240,.22)}
.bars{display:flex;align-items:flex-end;gap:10px;height:132px;padding-top:10px}
.bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:7px}
.bar{width:100%;max-width:56px;border-radius:8px 8px 4px 4px;min-height:3px;background:var(--grad);opacity:.85;transition:opacity .2s}
.bar-wrap:hover .bar{opacity:1}
.bar-wrap span{font-size:10.5px;color:var(--ink-3)}
#login{max-width:400px;margin:13vh auto 0;padding:34px 32px}
#login h1{font-size:22px;letter-spacing:-.4px;margin-bottom:6px}
#login p{color:var(--ink-3);font-size:12.5px;margin-bottom:24px}
#login .field{margin-bottom:14px}
.credit{text-align:center;color:var(--ink-3);font-size:12px;margin-top:22px}
.credit b{color:var(--ink-2);font-weight:600}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:min(400px,calc(100vw - 40px))}
.toast{padding:12px 16px;border-radius:16px;font-size:13px;background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.8);box-shadow:var(--sh);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.95)}to{opacity:1;transform:none}}
.toast.ok{border-left:4px solid var(--ok)}
.toast.err{border-left:4px solid var(--err)}
#sheet{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(70,60,110,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#sheet.on{display:flex}
.sheet-box{width:100%;max-width:820px;max-height:86vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:15px}
.sheet-body{padding:18px 24px;overflow-y:auto}
.sheet-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}
.site-group{margin-bottom:16px}
.site-group .gh{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-weight:600;font-size:13px}
.models{display:flex;flex-wrap:wrap;gap:7px}
.model{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;cursor:pointer;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);transition:.15s;user-select:none}
.model:hover{background:rgba(255,255,255,.9)}
.model input{width:auto;padding:0;margin:0;accent-color:#b07bea}
.model.on{background:rgba(190,150,245,.22);border-color:rgba(170,120,240,.45)}
.model.done{opacity:.45;cursor:default}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:2px 7px;border-radius:7px;
  background:rgba(255,255,255,.6);border:1px solid var(--line)}
.empty{text-align:center;color:var(--ink-3);padding:34px 10px;font-size:13px}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.note b{color:var(--ink)}
.banner{padding:14px 18px;border-radius:18px;font-size:13px;margin-bottom:18px;
  background:rgba(255,235,205,.6);border:1px solid rgba(217,150,43,.3);color:#8a6114}
footer{text-align:center;color:var(--ink-3);font-size:12px;padding:8px 0 30px}
footer b{color:var(--ink-2)}
@media (max-width:640px){
  .wrap{padding:14px 14px 50px}
  header.top{top:8px;margin:8px 10px 0;padding:12px 16px}
  .brand small{display:none}
  .card{padding:16px}
  .kpi .v{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .blob{animation:none}
  main section.active{animation:none}
}
</style>
</head>
<body>

<div class="bg">
  <span class="blob b1"></span><span class="blob b2"></span>
  <span class="blob b3"></span><span class="blob b4"></span>
</div>
<div class="grain"></div>

<div id="login" class="glass" hidden>
  <h1>RelayHub</h1>
  <p>中转站聚合网关 · 控制台</p>
  <div class="field"><label>用户名</label><input id="lg-user" value="admin"></div>
  <div class="field"><label>密码</label><input id="lg-pass" type="password"></div>
  <button class="primary" style="width:100%;margin-top:6px" onclick="doLogin(this)">登 录</button>
  <div class="credit">by <b>草翦</b></div>
</div>

<div id="app" hidden>
  <header class="top glass">
    <div class="brand"><span class="mark"></span>RelayHub<small>by 草翦</small></div>
    <div class="top-right">
      <span class="chip" id="who"></span>
      <button class="sm" onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="wrap">
    <nav class="tabs">
      <button data-tab="overview" class="active">概览</button>
      <button data-tab="sites">站点</button>
      <button data-tab="models">模型</button>
      <button data-tab="keys">密钥</button>
      <button data-tab="logs">日志</button>
      <button data-tab="settings">设置</button>
    </nav>
    <main>
      <section id="tab-overview" class="active"></section>
      <section id="tab-sites"></section>
      <section id="tab-models"></section>
      <section id="tab-keys"></section>
      <section id="tab-logs"></section>
      <section id="tab-settings"></section>
    </main>
    <footer>RelayHub · by <b>草翦</b></footer>
  </div>
</div>

<div id="sheet"><div class="sheet-box glass">
  <div class="sheet-head"><h3 id="sheet-title">标题</h3>
    <button class="sm" onclick="closeSheet()">关闭</button></div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot"></div>
</div></div>

<div id="toast"></div>

<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
let TOKEN = localStorage.getItem('rh_token') || '';
let SITES = [], ROUTES = [], EDIT_SITE = null, LOGS_TIMER = null, SCAN_RESULT = [];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jsq = (s) => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

function toast(msg, kind) {
  const d = document.createElement('div');
  d.className = 'toast ' + (kind || '');
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => { d.style.transition = 'opacity .3s, transform .3s';
    d.style.opacity = '0'; d.style.transform = 'translateX(20px)';
    setTimeout(() => d.remove(), 320); }, 4200);
}

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch('/admin/api' + path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { doLogout(); throw new Error('登录已过期'); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { detail: text }; }
  if (!res.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === 'string' ? d : (d ? JSON.stringify(d) : 'HTTP ' + res.status));
  }
  return data;
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/* ============ 登录 ============ */

async function doLogin(btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await api('/login', { method: 'POST', body: JSON.stringify({
      username: $('#lg-user').value.trim(), password: $('#lg-pass').value }) });
    TOKEN = r.token; localStorage.setItem('rh_token', TOKEN);
    $('#login').hidden = true; $('#app').hidden = false;
    $('#who').textContent = r.username;
    switchTab('overview');
  } catch (e) { toast(e.message, 'err'); }
  finally { if (btn) btn.disabled = false; }
}

function doLogout() {
  TOKEN = ''; localStorage.removeItem('rh_token');
  $('#app').hidden = true; $('#login').hidden = false;
  if (LOGS_TIMER) { clearInterval(LOGS_TIMER); LOGS_TIMER = null; }
}

/* ============ Tab ============ */

const RENDER = {};
function switchTab(name) {
  $$('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $$('main section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
  if (LOGS_TIMER && name !== 'logs') { clearInterval(LOGS_TIMER); LOGS_TIMER = null; }
  (RENDER[name] || (() => {}))();
}
$$('nav.tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ============ 概览 ============ */

RENDER.overview = async function () {
  const el = $('#tab-overview');
  try {
    const s = await api('/stats?days=7');
    const t = s.totals;
    const rate = t.requests ? Math.round(t.ok / t.requests * 100) : 0;
    const max = Math.max(1, ...s.daily.map(d => d.requests));
    const bars = s.daily.map(d =>
      `<div class="bar-wrap" title="${d.day} · ${d.requests} 次 · ${d.tokens} tokens">
        <div class="bar" style="height:${Math.max(3, Math.round(d.requests / max * 100))}%"></div>
        <span>${d.day.slice(5)}</span></div>`).join('');
    const rows = s.sites.map(x => {
      const st = !x.enabled ? '<span class="tag dim">已停用</span>'
        : x.circuit_active ? '<span class="tag err">熔断中</span>'
        : '<span class="tag ok">正常</span>';
      const q = x.quota_known
        ? (x.quota_remaining != null ? x.quota_remaining.toFixed(2)
          : (x.quota_used != null ? '已用 ' + x.quota_used.toFixed(2) : '已知'))
        : '<span class="muted">未知</span>';
      return `<tr><td>${esc(x.name)}</td><td class="mono">${esc(x.base_url)}</td>
        <td>${st}</td><td>${x.today_total}</td><td>${x.period_requests}</td><td>${q}</td>
        <td class="muted" title="${esc(x.last_error || '')}">${esc((x.last_error || '').slice(0, 36))}</td></tr>`;
    }).join('');
    el.innerHTML = `
      <div class="kpis">
        <div class="kpi glass"><div class="v">${t.today_requests}</div><div class="k">今日请求</div></div>
        <div class="kpi glass"><div class="v">${t.requests}</div><div class="k">近 7 天请求</div></div>
        <div class="kpi glass"><div class="v">${rate}%</div><div class="k">成功率</div></div>
        <div class="kpi glass"><div class="v">${t.tokens.toLocaleString()}</div><div class="k">近 7 天 Tokens</div></div>
        <div class="kpi glass"><div class="v">${t.sites}</div><div class="k">站点数</div></div>
        <div class="kpi glass"><div class="v">${t.models}</div><div class="k">已配模型</div></div>
      </div>
      <div class="card glass"><h2>近 7 天请求量</h2><div class="bars">${bars}</div></div>
      <div class="card glass"><h2>站点状态</h2><div class="scroll"><table>
        <thead><tr><th>名称</th><th>地址</th><th>状态</th><th>今日调用</th><th>近 7 天</th><th>剩余额度</th><th>最后错误</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty">还没有站点，去「站点」页添加</td></tr>'}</tbody>
      </table></div></div>`;
  } catch (e) { el.innerHTML = `<div class="card glass empty">加载失败：${esc(e.message)}</div>`; }
};

/* ============ 站点 ============ */

RENDER.sites = async function () {
  const el = $('#tab-sites');
  try {
    SITES = await api('/sites');
    const rows = SITES.map(s => {
      const st = !s.enabled ? '<span class="tag dim">停用</span>'
        : s.circuit_active ? '<span class="tag err">熔断</span>' : '<span class="tag ok">正常</span>';
      const q = s.quota_known
        ? (s.quota_remaining != null ? s.quota_remaining.toFixed(2) : '<span class="muted">仅已用</span>')
        : '<span class="muted">未知</span>';
      return `<tr>
        <td><b>${esc(s.name)}</b>${s.note ? `<br><span class="muted">${esc(s.note)}</span>` : ''}</td>
        <td class="mono">${esc(s.base_url)}</td>
        <td class="mono">${esc(s.api_key_masked) || '<span class="muted">未设</span>'}</td>
        <td>${s.priority}</td><td>${st}</td><td>${s.today_total}</td><td>${q}</td>
        <td class="muted nowrap">${fmtTime(s.quota_checked_at)}</td>
        <td class="nowrap">
          <button class="sm" onclick="editSite(${s.id})">编辑</button>
          <button class="sm" onclick="syncSite(${s.id})">拉模型</button>
          <button class="sm" onclick="quotaSite(${s.id})">查额度</button>
          <button class="sm" onclick="resetSite(${s.id})">解熔断</button>
          <button class="sm danger" onclick="delSite(${s.id})">删除</button>
        </td></tr>`;
    }).join('');
    el.innerHTML = `

function cancelSite() {
  EDIT_SITE = null;
  ['s-name', 's-url', 's-key', 's-note'].forEach(i => $('#' + i).value = '');
  $('#s-pri').value = 100; $('#s-enabled').value = '1';
  $('#site-form-title').textContent = '新增站点';
  $('#s-cancel').hidden = true;
}

function editSite(id) {
  const s = SITES.find(x => x.id === id); if (!s) return;
  EDIT_SITE = id;
  $('#s-name').value = s.name; $('#s-url').value = s.base_url; $('#s-key').value = '';
  $('#s-pri').value = s.priority; $('#s-enabled').value = s.enabled ? '1' : '0';
  $('#s-note').value = s.note || '';
  $('#site-form-title').textContent = '编辑站点 #' + id;
  $('#s-cancel').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function saveSite() {
  const payload = {
    name: $('#s-name').value.trim(), base_url: $('#s-url').value.trim(),
    api_key: $('#s-key').value.trim(), priority: parseInt($('#s-pri').value || '100', 10),
    enabled: $('#s-enabled').value === '1', note: $('#s-note').value.trim()
  };
  if (!payload.name || !payload.base_url) return toast('名称和地址必填', 'err');
  try {
    if (EDIT_SITE) await api('/sites/' + EDIT_SITE, { method: 'PUT', body: JSON.stringify(payload) });
    else await api('/sites', { method: 'POST', body: JSON.stringify(payload) });
    toast('已保存', 'ok'); cancelSite(); RENDER.sites();
  } catch (e) { toast(e.message, 'err'); }
}

async function delSite(id) {
  if (!confirm('删除该站点及其全部路由？')) return;
  try { await api('/sites/' + id, { method: 'DELETE' }); toast('已删除', 'ok'); RENDER.sites(); }
  catch (e) { toast(e.message, 'err'); }
}

async function resetSite(id) {
  try { await api('/sites/' + id + '/reset', { method: 'POST' }); toast('已解除熔断', 'ok'); RENDER.sites(); }
  catch (e) { toast(e.message, 'err'); }
}

async function syncSite(id) {
  toast('正在拉取模型…');
  try {
    const r = await api('/sites/' + id + '/test', { method: 'POST' });
    if (!r.ok) return toast(r.message, 'err');
    if (!r.models.length) return toast('该站点没有返回任何模型', 'err');
    const all = await api('/routes');
    const have = new Set(all.filter(x => x.site_id === id).map(x => x.model));
    const picked = r.models.filter(m => !have.has(m));
    if (!picked.length) return toast(`发现 ${r.models.length} 个模型，全部已导入`, 'ok');
    if (!confirm(`发现 ${r.models.length} 个模型，其中 ${picked.length} 个尚未导入。\n\n全部导入？`)) return;
    await api('/models/import', { method: 'POST',
      body: JSON.stringify({ items: picked.map(m => ({ site_id: id, model: m })) }) });
    toast(`已导入 ${picked.length} 个模型`, 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function quotaSite(id) {
  toast('查询中…');
  try {
    const r = await api('/sites/' + id + '/quota', { method: 'POST' });
    if (r.known) toast('剩余：' + (r.remaining != null ? r.remaining : '?') + ' / 上限 ' + (r.limit != null ? r.limit : '?'));
    else toast('查不到额度：' + (r.error || '接口不支持'), 'err');
    RENDER.sites();
  } catch (e) { toast(e.message, 'err'); }
}

      </div>

        </table></div>

function openSheet(title, bodyHtml, footHtml) {
  $('#sheet-title').textContent = title;
  $('#sheet-body').innerHTML = bodyHtml;
  $('#sheet-foot').innerHTML = footHtml || '';
  $('#sheet').classList.add('on');
}
function closeSheet() { $('#sheet').classList.remove('on'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

async function scanAll() {
  openSheet('扫描站点模型', '<div class="empty">正在扫描，请稍候…</div>', '');
  try { SCAN_RESULT = await api('/models/scan', { method: 'POST' }); }
  catch (e) { $('#sheet-body').innerHTML = `<div class="empty">扫描失败：${esc(e.message)}</div>`; return; }
  drawScan();
}

function drawScan() {
  const okList = SCAN_RESULT.filter(r => r.ok);
  const badList = SCAN_RESULT.filter(r => !r.ok);
  let total = 0, fresh = 0;
  okList.forEach(r => {
    const have = new Set(r.existing);
    r.models.forEach(m => { total++; if (!have.has(m)) fresh++; });
  });
  const groups = okList.map(r => {
    const have = new Set(r.existing);
    const chips = r.models.map(m => {
      const done = have.has(m);
      return `<label class="model ${done ? 'done' : 'on'}" data-site="${r.site_id}" data-model="${esc(m)}">
        <input type="checkbox" ${done ? 'disabled' : 'checked'} onchange="this.parentNode.classList.toggle('on', this.checked)">
        ${esc(m)}${done ? ' <span class="tag dim">已导入</span>' : ''}</label>`;
    }).join('');
    return `<div class="site-group"><div class="gh">${esc(r.site_name)}
      <span class="tag ${r.models.length ? 'acc' : 'dim'}">${r.models.length} 个</span></div>
      <div class="models">${chips || '<span class="muted">无</span>'}</div></div>`;
  }).join('');
  const badHtml = badList.map(r => `<div class="site-group"><div class="gh">${esc(r.site_name)}
    <span class="tag err">失败</span></div><div class="note">${esc(r.error)}</div></div>`).join('');
  $('#sheet-body').innerHTML = `
    <div class="note" style="margin-bottom:16px">共发现 <b>${total}</b> 个模型，其中 <b>${fresh}</b> 个尚未导入。已导入的会置灰跳过。</div>
    ${groups || '<div class="empty">没有可用的站点</div>'}
    ${badHtml ? '<hr>' + badHtml : ''}`;
  $('#sheet-foot').innerHTML = `<span class="muted">默认每日上限</span>
    <input id="imp-limit" type="number" value="0" style="width:110px">
    <button onclick="closeSheet()">取消</button>
    <button class="primary" onclick="importScan()" ${fresh ? '' : 'disabled'}>导入选中的 ${fresh} 个</button>`;
}

async function importScan() {
  const items = [];
  $$('#sheet-body .model').forEach(lb => {
    const cb = lb.querySelector('input');
    if (!cb || cb.disabled || !cb.checked) return;
    items.push({ site_id: parseInt(lb.dataset.site, 10), model: lb.dataset.model });
  });
  if (!items.length) return toast('没有选中任何模型', 'err');
  const limit = parseInt($('#imp-limit').value || '0', 10);
  try {
    const r = await api('/models/import', { method: 'POST', body: JSON.stringify({ items, daily_limit: limit }) });
    toast(`已导入 ${r.added} 个模型`, 'ok');
    closeSheet(); RENDER.models();
  } catch (e) { toast(e.message, 'err'); }
}

        <div class="gap"><button class="primary" onclick="saveSettings()">保存设置</button></div>
      </div>

      <div class="card glass"><h2>面板账号</h2>
        <div class="note" style="margin-bottom:14px">
          <b>面板密码建议放在环境变量 <code>ADMIN_PASSWORD</code> 里。</b>设置后它就是唯一来源，每次启动都会校正；
          万一忘记密码，去部署平台改一下环境变量再重启服务就能找回，不会被锁在面板外面。<br>
          各中转站的 API Key 不在环境变量里，它们保存在持久卷的数据库里。
        </div>
        <div class="row" style="margin-bottom:14px">
          <div><span class="tag ${pwEnv ? 'acc' : 'ok'}">密码来源：${pwEnv ? '环境变量 ADMIN_PASSWORD' : '数据库（可在本页修改）'}</span></div>
          <div><span class="tag ${userEnv ? 'acc' : 'ok'}">账号来源：${userEnv ? '环境变量 ADMIN_USERNAME' : '数据库'}</span></div>
        </div>
        <div class="row"><div><label>用户名</label><input id="cf-user" value="${esc(acc.username)}" ${userEnv ? 'disabled' : ''}></div></div>
        ${pwEnv
          ? `<div class="note" style="margin-top:12px">密码由环境变量管理。要修改请到部署平台调整 <code>ADMIN_PASSWORD</code>，然后重启服务。</div>`
          : `<div class="row gap">
               <div><label>原密码</label><input id="cf-old" type="password"></div>
               <div><label>新密码（至少 6 位）</label><input id="cf-new" type="password" placeholder="留空表示不修改"></div>
             </div>`}
        <div class="gap">
          <button class="primary" onclick="saveAccount()" ${(pwEnv && userEnv) ? 'disabled' : ''}>保存</button>
        </div>
      </div>

      <div class="card glass"><h2>备份与恢复</h2>
        <div class="note" style="margin-bottom:14px">导出内容包含站点、API Key、路由与设置，导出的 JSON 请自行妥善保管。</div>
        <div class="row" style="max-width:560px">
          <div><button onclick="exportCfg()">导出配置</button></div>
          <div><button onclick="importCfgClick()">导入配置</button>
            <input id="imp-file" type="file" accept="application/json" style="display:none" onchange="importCfg(this)"></div>
        </div>
      </div>`;
  } catch (e) { el.innerHTML = `<div class="card glass empty">加载失败：${esc(e.message)}</div>`; }
};

async function saveSettings() {
  const payload = {
    strategy: $('#st-strategy').value, max_attempts: parseInt($('#st-max').value, 10),
    circuit_threshold: parseInt($('#st-th').value, 10), circuit_cooldown: parseInt($('#st-cool').value, 10),
    quota_check_interval: parseInt($('#st-q').value, 10), inject_stream_usage: $('#st-inject').value === '1',
    auto_sync_models: $('#st-sync').value === '1', auto_sync_interval: parseInt($('#st-si').value, 10)
  };
  try { await api('/settings', { method: 'PUT', body: JSON.stringify(payload) }); toast('已保存', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}

async function saveAccount() {
  const payload = {
    username: $('#cf-user').value.trim(),
    old_password: $('#cf-old') ? $('#cf-old').value : '',
    new_password: $('#cf-new') ? $('#cf-new').value : ''
  };
  try {
    await api('/account', { method: 'PUT', body: JSON.stringify(payload) });
    toast('已保存', 'ok');
    RENDER.settings();
  } catch (e) { toast(e.message, 'err'); }
}

async function exportCfg() {
  try {
    const data = await api('/export');
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'relayhub-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已导出', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

function importCfgClick() { $('#imp-file').click(); }

function importCfg(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = async () => {
    if (!confirm('导入会覆盖同名站点与路由，且不可撤销。继续？')) { input.value = ''; return; }
    try {
      const parsed = JSON.parse(reader.result);
      const r = await api('/import', { method: 'POST', body: JSON.stringify({ data: parsed }) });
      toast(`导入完成：站点 ${r.sites}、路由 ${r.routes}、密钥 ${r.keys}`, 'ok');
    } catch (e) { toast('导入失败：' + e.message, 'err'); }
    input.value = '';
  };
  reader.readAsText(f);
}

/* ============ 启动 ============ */

(async function boot() {
  if (!TOKEN) { $('#login').hidden = false; return; }
  try {
    const me = await api('/me');
    $('#who').textContent = me.username; $('#app').hidden = false; switchTab('overview');
  } catch (e) { $('#login').hidden = false; }
})();
$('#lg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
