<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RelayHub 控制台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1216;--panel:#171b21;--panel2:#1e232b;--line:#2a3039;--fg:#e6e9ef;--dim:#8b95a5;--acc:#4c8dff;--ok:#2ecc71;--warn:#f0b429;--err:#ff5c5c}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--acc)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:6px 12px;border-radius:6px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--err);border-color:#4a2a2a}
button.sm{padding:3px 8px;font-size:12px}
input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:7px 10px;border-radius:6px;width:100%}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
#login{max-width:360px;margin:14vh auto;background:var(--panel);padding:28px;border-radius:12px;border:1px solid var(--line)}
#login h1{font-size:20px;margin-bottom:4px}
#login p{color:var(--dim);font-size:12px;margin-bottom:18px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px}
nav{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
nav button{border:none;background:transparent;border-bottom:2px solid transparent;border-radius:0;color:var(--dim);padding:8px 14px;white-space:nowrap}
nav button.active{color:var(--fg);border-bottom-color:var(--acc)}
main{padding:20px;max-width:1400px;margin:0 auto}
section{display:none}section.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;margin-bottom:12px;color:var(--dim);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .v{font-size:24px;font-weight:700}
.kpi .k{font-size:12px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--dim);font-weight:600;font-size:12px}
td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:#1e4d33}
.tag.err{color:var(--err);border-color:#4d2020}
.tag.warn{color:var(--warn);border-color:#4d3a12}
.tag.dim{color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bar{width:100%;background:linear-gradient(180deg,var(--acc),#2b5fd9);border-radius:4px 4px 0 0;min-height:2px}
.bar-wrap span{font-size:10px;color:var(--dim)}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);padding:10px 14px;border-radius:6px;max-width:380px;font-size:13px}
.toast.err{border-left-color:var(--err)}
.toast.ok{border-left-color:var(--ok)}
.muted{color:var(--dim);font-size:12px}
.scroll{overflow-x:auto}
</style>
</head>
<body>

<div id="login" hidden>
  <h1>RelayHub</h1>
  <p>中转站聚合网关 · 控制台</p>
  <div style="margin-bottom:12px"><label>用户名</label><input id="lg-user" value="admin"></div>
  <div style="margin-bottom:16px"><label>密码</label><input id="lg-pass" type="password"></div>
  <button class="primary" style="width:100%" onclick="doLogin()">登录</button>
</div>

<div id="app" hidden>
  <header>
    <h1>RelayHub 控制台</h1>
    <div class="row" style="align-items:center">
      <span class="muted" id="who"></span>
      <button class="sm" onclick="doLogout()">退出</button>
    </div>
  </header>
  <nav>
    <button data-tab="overview" class="active">概览</button>
    <button data-tab="sites">站点</button>
    <button data-tab="routes">路由 / 限额</button>
    <button data-tab="keys">API 密钥</button>
    <button data-tab="logs">日志</button>
    <button data-tab="settings">设置</button>
  </nav>
  <main>
    <section id="tab-overview" class="active"></section>
    <section id="tab-sites"></section>
    <section id="tab-routes"></section>
    <section id="tab-keys"></section>
    <section id="tab-logs"></section>
    <section id="tab-settings"></section>
  </main>
</div>

<div id="toast"></div>

<script>
const $ = (s, r = document) => (r || document).querySelector(s);
const $$ = (s, r = document) => Array.from((r || document).querySelectorAll(s));
let TOKEN = localStorage.getItem('rh_token') || '';
let SITES = [], KEYS = [], EDIT_SITE = null, LOGS_TIMER = null;

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, kind = '') {
  const d = document.createElement('div');
  d.className = 'toast ' + kind;
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch('/admin/api' + path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { doLogout(); throw new Error('登录已过期'); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { detail: text }; }
  if (!res.ok) throw new Error((data && data.detail) ? (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)) : ('HTTP ' + res.status));
  return data;
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/* ---------------- 登录 ---------------- */

async function doLogin() {
  try {
    const r = await api('/login', {
      method: 'POST',
      body: JSON.stringify({ username: $('#lg-user').value.trim(), password: $('#lg-pass').value })
    });
    TOKEN = r.token; localStorage.setItem('rh_token', TOKEN);
    $('#login').hidden = true; $('#app').hidden = false; $('#who').textContent = r.username;
    switchTab('overview');
  } catch (e) { toast(e.message, 'err'); }
}

function doLogout() {
  TOKEN = ''; localStorage.removeItem('rh_token');
  $('#app').hidden = true; $('#login').hidden = false;
  if (LOGS_TIMER) { clearInterval(LOGS_TIMER); LOGS_TIMER = null; }
}

/* ---------------- Tab ---------------- */

const RENDER = {};
function switchTab(name) {
  $$('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $$('main section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
  if (LOGS_TIMER && name !== 'logs') { clearInterval(LOGS_TIMER); LOGS_TIMER = null; }
  (RENDER[name] || (() => {}))();
}

$$('nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ---------------- 概览 ---------------- */

RENDER.overview = async function () {
  const el = $('#tab-overview');
  try {
    const s = await api('/stats?days=7');
    const t = s.totals;
    const rate = t.requests ? Math.round(t.ok / t.requests * 100) : 0;
    const max = Math.max(1, ...s.daily.map(d => d.requests));
    const bars = s.daily.map(d =>
      `<div class="bar-wrap" title="${d.day} · ${d.requests} 次 · ${d.tokens} tokens">
         <div class="bar" style="height:${Math.max(2, Math.round(d.requests / max * 100))}%"></div>
         <span>${d.day.slice(5)}</span></div>`).join('');
    const rows = s.sites.map(x => {
      const q = x.quota_known
        ? (x.quota_remaining != null ? x.quota_remaining.toFixed(2) : (x.quota_used != null ? '已用 ' + x.quota_used.toFixed(2) : '未知'))
        : '<span class="muted">未知</span>';
      const st = !x.enabled ? '<span class="tag dim">已停用</span>'
        : x.circuit_active ? '<span class="tag err">熔断中</span>'
        : '<span class="tag ok">正常</span>';
      return `<tr><td>${esc(x.name)}</td><td class="mono">${esc(x.base_url)}</td>
        <td>${st}</td><td>${x.today_total}</td><td>${x.period_requests}</td><td>${q}</td>
        <td class="muted" title="${esc(x.last_error || '')}">${esc((x.last_error || '').slice(0, 40))}</td></tr>`;
    }).join('');
    el.innerHTML = `
      <div class="cards">
        <div class="kpi"><div class="v">${t.today_requests}</div><div class="k">今日请求</div></div>
        <div class="kpi"><div class="v">${t.requests}</div><div class="k">近 7 天请求</div></div>
        <div class="kpi"><div class="v">${rate}%</div><div class="k">成功率</div></div>
        <div class="kpi"><div class="v">${t.tokens.toLocaleString()}</div><div class="k">近 7 天 Tokens</div></div>
        <div class="kpi"><div class="v">${t.sites}</div><div class="k">站点数</div></div>
        <div class="kpi"><div class="v">${t.models}</div><div class="k">已配模型</div></div>
      </div>
      <div class="card"><h2>近 7 天请求量</h2><div class="bars">${bars}</div></div>
      <div class="card"><h2>站点状态</h2><div class="scroll"><table>
        <tr><th>名称</th><th>地址</th><th>状态</th><th>今日调用</th><th>近7天</th><th>剩余额度</th><th>最后错误</th></tr>
        ${rows || '<tr><td colspan="7" class="muted">还没有站点，去「站点」页添加</td></tr>'}
      </table></div></div>`;
  } catch (e) { el.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
};

/* ---------------- 站点 ---------------- */

RENDER.sites = async function () {
  const el = $('#tab-sites');
  try {
    SITES = await api('/sites');
    const rows = SITES.map(s => {
      const st = !s.enabled ? '<span class="tag dim">停用</span>'
        : s.circuit_active ? '<span class="tag err">熔断</span>' : '<span class="tag ok">正常</span>';
      const q = s.quota_known
        ? (s.quota_remaining != null ? s.quota_remaining.toFixed(2) : '-')
        : '<span class="muted">未知</span>';
      return `<tr>
        <td>${esc(s.name)}</td>
        <td class="mono">${esc(s.base_url)}</td>
        <td class="mono">${esc(s.api_key_masked) || '<span class="muted">未设</span>'}</td>
        <td>${s.priority}</td><td>${st}</td><td>${s.today_total}</td><td>${q}</td>
        <td class="muted">${fmtTime(s.quota_checked_at)}</td>
        <td style="white-space:nowrap">
          <button class="sm" onclick="editSite(${s.id})">编辑</button>
          <button class="sm" onclick="testSite(${s.id})">测试</button>
          <button class="sm" onclick="quotaSite(${s.id})">查额度</button>
          <button class="sm" onclick="resetSite(${s.id})">解熔断</button>
          <button class="sm danger" onclick="delSite(${s.id})">删除</button>
        </td></tr>`;
    }).join('');
    el.innerHTML = `
      <div class="card"><h2 id="site-form-title">新增站点</h2>
        <div class="row">
          <div><label>名称</label><input id="s-name" placeholder="例如 站A"></div>
          <div><label>Base URL</label><input id="s-url" placeholder="https://api.example.com 或 .../v1"></div>
          <div><label>API Key</label><input id="s-key" placeholder="sk-...（编辑时留空表示不改）"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div style="max-width:140px"><label>优先级（小优先）</label><input id="s-pri" type="number" value="100"></div>
          <div style="max-width:140px"><label>启用</label><select id="s-enabled"><option value="1">是</option><option value="0">否</option></select></div>
          <div><label>备注</label><input id="s-note"></div>
        </div>
        <div style="margin-top:12px">
          <button class="primary" onclick="saveSite()">保存</button>
          <button onclick="cancelSite()" id="s-cancel" hidden>取消编辑</button>
        </div>
      </div>
      <div class="card"><h2>站点列表（${SITES.length}）</h2><div class="scroll"><table>
        <tr><th>名称</th><th>地址</th><th>Key</th><th>优先级</th><th>状态</th><th>今日</th><th>剩余</th><th>额度查询</th><th>操作</th></tr>
        ${rows || '<tr><td colspan="9" class="muted">空</td></tr>'}
      </table></div></div>`;
  } catch (e) { el.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
};

function cancelSite() {
  EDIT_SITE = null;
  ['s-name', 's-url', 's-key', 's-note'].forEach(i => $('#' + i).value = '');
  $('#s-pri').value = 100; $('#s-enabled').value = '1';
  $('#site-form-title').textContent = '新增站点';
  $('#s-cancel').hidden = true;
}

function editSite(id) {
  const s = SITES.find(x => x.id === id); if (!s) return;
  EDIT_SITE = id;
  $('#s-name').value = s.name; $('#s-url').value = s.base_url; $('#s-key').value = '';
  $('#s-pri').value = s.priority; $('#s-enabled').value = s.enabled ? '1' : '0';
  $('#s-note').value = s.note || '';
  $('#site-form-title').textContent = '编辑站点 #' + id;
  $('#s-cancel').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function saveSite() {
  const payload = {
    name: $('#s-name').value.trim(), base_url: $('#s-url').value.trim(),
    api_key: $('#s-key').value.trim(), priority: parseInt($('#s-pri').value || '100', 10),
    enabled: $('#s-enabled').value === '1', note: $('#s-note').value.trim()
  };
  if (!payload.name || !payload.base_url) return toast('名称和地址必填', 'err');
  try {
    if (EDIT_SITE) await api('/sites/' + EDIT_SITE, { method: 'PUT', body: JSON.stringify(payload) });
    else await api('/sites', { method: 'POST', body: JSON.stringify(payload) });
    toast('已保存', 'ok'); cancelSite(); RENDER.sites();
  } catch (e) { toast(e.message, 'err'); }
}

async function delSite(id) {
  if (!confirm('删除站点 #' + id + ' 及其所有路由？')) return;
  try { await api('/sites/' + id, { method: 'DELETE' }); toast('已删除', 'ok'); RENDER.sites(); }
  catch (e) { toast(e.message, 'err'); }
}

async function resetSite(id) {
  try { await api('/sites/' + id + '/reset', { method: 'POST' }); toast('已解除熔断', 'ok'); RENDER.sites(); }
  catch (e) { toast(e.message, 'err'); }
}

async function testSite(id) {
  toast('测试中…');
  try {
    const r = await api('/sites/' + id + '/test', { method: 'POST' });
    if (r.ok) {
      toast(r.message, 'ok');
      if (r.models && r.models.length) {
        if (confirm(r.message + '\n\n要自动把这些模型加进「路由」吗？\n（已存在会覆盖上游名与限额）')) {
          for (const m of r.models.slice(0, 300)) {
            try { await api('/routes', { method: 'POST', body: JSON.stringify({ site_id: id, model: m, daily_limit: 0 }) }); } catch (e) {}
          }
          toast('模型已导入', 'ok');
        }
      }
    } else toast(r.message, 'err');
  } catch (e) { toast(e.message, 'err'); }
}

async function quotaSite(id) {
  toast('查询中…');
  try {
    const r = await api('/sites/' + id + '/quota', { method: 'POST' });
    if (r.known) toast('剩余：' + (r.remaining != null ? r.remaining : '?') + ' / 上限 ' + (r.limit != null ? r.limit : '?'), 'ok');
    else toast('查不到额度：' + (r.error || '接口不支持'), 'err');
    RENDER.sites();
  } catch (e) { toast(e.message, 'err'); }
}

/* ---------------- 路由 ---------------- */

RENDER.routes = async function () {
  const el = $('#tab-routes');
  try {
    const [routes, sites] = await Promise.all([api('/routes'), api('/sites')]);
    const opts = sites.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
    const rows = routes.map(r => {
      const over = r.daily_limit > 0 && r.today_count >= r.daily_limit;
      return `<tr>
        <td>${esc(r.model)}</td>
        <td class="mono">${esc(r.upstream_model) || '<span class="muted">同名</span>'}</td>
        <td>${esc(r.site_name)}${r.site_enabled ? '' : ' <span class="tag dim">站点停用</span>'}</td>
        <td>${r.today_count}</td>
        <td>${r.daily_limit > 0 ? r.daily_limit : '<span class="muted">不限</span>'} ${over ? '<span class="tag err">已用尽</span>' : ''}</td>
        <td>${r.enabled ? '<span class="tag ok">启用</span>' : '<span class="tag dim">停用</span>'}</td>
        <td style="white-space:nowrap">
          <button class="sm" onclick="editRoute(${r.id},${r.daily_limit},'${esc(r.upstream_model)}')">改</button>
          <button class="sm danger" onclick="delRoute(${r.id})">删</button>
        </td></tr>`;
    }).join('');
    el.innerHTML = `
      <div class="card"><h2>新增路由（站点 × 模型）</h2>
        <div class="row">
          <div><label>站点</label><select id="r-site">${opts || '<option value="">（先加站点）</option>'}</select></div>
          <div><label>模型名（客户端请求用的名字）</label><input id="r-model" placeholder="gemini-2.5-pro"></div>
          <div><label>上游实际模型名（留空=同名）</label><input id="r-up" placeholder="留空即可"></div>
          <div style="max-width:160px"><label>每日上限（0=不限）</label><input id="r-limit" type="number" value="0"></div>
        </div>
        <div style="margin-top:12px"><button class="primary" onclick="saveRoute()">添加</button>
        <span class="muted" style="margin-left:10px">同一个模型名配到多个站点，就会在这些站点之间自动负载 + 故障切换</span></div>
      </div>
      <div class="card"><h2>路由列表（${routes.length}）</h2><div class="scroll"><table>
        <tr><th>模型</th><th>上游名</th><th>站点</th><th>今日</th><th>每日上限</th><th>状态</th><th>操作</th></tr>
        ${rows || '<tr><td colspan="7" class="muted">空</td></tr>'}
      </table></div></div>`;
  } catch (e) { el.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
};

async function saveRoute() {
  const payload = {
    site_id: parseInt($('#r-site').value, 10), model: $('#r-model').value.trim(),
    upstream_model: $('#r-up').value.trim(), daily_limit: parseInt($('#r-limit').value || '0', 10)
  };
  if (!payload.site_id || !payload.model) return toast('站点和模型名必填', 'err');
  try { await api('/routes', { method: 'POST', body: JSON.stringify(payload) }); toast('已添加', 'ok'); RENDER.routes(); }
  catch (e) { toast(e.message, 'err'); }
}

async function editRoute(id, limit, up) {
  const nl = prompt('每日上限（0=不限）：', limit);
  if (nl === null) return;
  const nu = prompt('上游实际模型名（留空=同名）：', up);
  if (nu === null) return;
  try {
    await api('/routes/' + id, { method: 'PUT', body: JSON.stringify({ daily_limit: parseInt(nl || '0', 10), upstream_model: nu }) });
    toast('已更新', 'ok'); RENDER.routes();
  } catch (e) { toast(e.message, 'err'); }
}

async function delRoute(id) {
  if (!confirm('删除该路由？')) return;
  try { await api('/routes/' + id, { method: 'DELETE' }); toast('已删除', 'ok'); RENDER.routes(); }
  catch (e) { toast(e.message, 'err'); }
}

/* ---------------- API 密钥 ---------------- */

RENDER.keys = async function () {
  const el = $('#tab-keys');
  try {
    KEYS = await api('/keys');
    const rows = KEYS.map(k => `<tr>
      <td>${esc(k.name)}</td>
      <td class="mono">${esc(k.key)}</td>
      <td>${k.today_count}</td>
      <td>${k.daily_limit > 0 ? k.daily_limit : '<span class="muted">不限</span>'}</td>
      <td>${k.enabled ? '<span class="tag ok">启用</span>' : '<span class="tag dim">停用</span>'}</td>
      <td class="muted">${fmtTime(k.last_used_at)}</td>
      <td style="white-space:nowrap">
        <button class="sm" onclick="copyKey('${esc(k.key)}')">复制</button>
        <button class="sm" onclick="toggleKey(${k.id},${k.enabled ? 0 : 1})">${k.enabled ? '停用' : '启用'}</button>
        <button class="sm danger" onclick="delKey(${k.id})">删除</button>
      </td></tr>`).join('');
    el.innerHTML = `
      ${KEYS.length === 0 ? '<div class="card" style="border-color:#4d3a12"><b>当前是开放模式</b>：没有任何 API Key，任何人都能调用本接口。建议马上创建一个；如果你只想自己用，创建一个 key 后对外开放的调用就会被拦住。</div>' : ''}
      <div class="card"><h2>新建 API Key</h2>
        <div class="row">
          <div><label>备注名</label><input id="k-name" placeholder="例如 我的手机"></div>
          <div style="max-width:200px"><label>每日请求上限（0=不限）</label><input id="k-limit" type="number" value="0"></div>
        </div>
        <div style="margin-top:12px"><button class="primary" onclick="saveKey()">生成</button></div>
      </div>
      <div class="card"><h2>密钥列表（${KEYS.length}）</h2>
        <div class="muted" style="margin-bottom:10px">客户端 Base URL 填 <span class="mono">${location.origin}/v1</span> ，Key 填下面任意一个</div>
        <div class="scroll"><table>
          <tr><th>备注</th><th>Key</th><th>今日</th><th>每日上限</th><th>状态</th><th>最后使用</th><th>操作</th></tr>
          ${rows || '<tr><td colspan="7" class="muted">空</td></tr>'}
        </table></div></div>`;
  } catch (e) { el.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
};

async function saveKey() {
  try {
    const r = await api('/keys', { method: 'POST', body: JSON.stringify({ name: $('#k-name').value.trim(), daily_limit: parseInt($('#k-limit').value || '0', 10) }) });
    toast('已生成：' + r.key, 'ok'); RENDER.keys();
  } catch (e) { toast(e.message, 'err'); }
}
async function delKey(id) {
  if (!confirm('删除该 Key？对方将立刻无法调用。')) return;
  try { await api('/keys/' + id, { method: 'DELETE' }); toast('已删除', 'ok'); RENDER.keys(); }
  catch (e) { toast(e.message, 'err'); }
}
async function toggleKey(id, enabled) {
  try { await api('/keys/' + id, { method: 'PUT', body: JSON.stringify({ enabled: !!enabled }) }); RENDER.keys(); }
  catch (e) { toast(e.message, 'err'); }
}
function copyKey(k) {
  navigator.clipboard.writeText(k).then(() => toast('已复制', 'ok'), () => prompt('手动复制：', k));
}

/* ---------------- 日志 ---------------- */

RENDER.logs = async function () {
  const el = $('#tab-logs');
  const sites = await api('/sites').catch(() => []);
  const cur = $('#log-site') ? $('#log-site').value : '';
  const opts = sites.map(s => `<option value="${s.id}" ${String(s.id) === cur ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  el.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:end">
        <div style="max-width:240px"><label>按站点筛选</label>
          <select id="log-site" onchange="loadLogs()"><option value="">全部站点</option>${opts}</select></div>
        <div style="max-width:160px"><label>条数</label>
          <select id="log-limit" onchange="loadLogs()"><option>100</option><option>200</option><option>500</option></select></div>
        <div style="max-width:200px"><label>自动刷新</label>
          <select id="log-auto" onchange="toggleAuto()"><option value="0">关</option><option value="5">每 5 秒</option><option value="15">每 15 秒</option></select></div>
        <div><button onclick="loadLogs()">刷新</button>
          <button class="danger" onclick="clearLogs()">清空日志</button></div>
      </div>
    </div>
    <div class="card"><h2>请求日志</h2><div id="log-body" class="scroll"><span class="muted">加载中…</span></div></div>`;
  loadLogs();
};

async function loadLogs() {
  const site = $('#log-site').value;
  const limit = $('#log-limit').value;
  try {
    const rows = await api('/logs?site_id=' + (site || 0) + '&limit=' + limit);
    $('#log-body').innerHTML = `<table>
      <tr><th>时间</th><th>站点</th><th>模型</th><th>Key</th><th>尝试</th><th>结果</th><th>耗时</th><th>Tokens</th><th>错误</th></tr>
      ${rows.map(r => `<tr>
        <td class="mono">${fmtTime(r.ts)}</td>
        <td>${esc(r.site_name)}</td>
        <td class="mono">${esc(r.model)}</td>
        <td>${esc(r.key_name)}</td>
        <td>#${r.attempt}${r.stream ? ' 流式' : ''}</td>
        <td>${r.ok ? '<span class="tag ok">成功</span>' : '<span class="tag err">' + (r.status_code || '失败') + '</span>'}</td>
        <td>${r.latency_ms}ms</td>
        <td>${r.total_tokens || ''}</td>
        <td class="muted" style="max-width:340px">${esc((r.error || '').slice(0, 160))}</td>
      </tr>`).join('') || '<tr><td colspan="9" class="muted">暂无日志</td></tr>'}
    </table>`;
  } catch (e) { $('#log-body').innerHTML = `<span class="muted">加载失败：${esc(e.message)}</span>`; }
}

function toggleAuto() {
  if (LOGS_TIMER) { clearInterval(LOGS_TIMER); LOGS_TIMER = null; }
  const sec = parseInt($('#log-auto').value, 10);
  if (sec > 0) LOGS_TIMER = setInterval(loadLogs, sec * 1000);
}

async function clearLogs() {
  if (!confirm('清空全部日志？')) return;
  try { await api('/logs', { method: 'DELETE' }); toast('已清空', 'ok'); loadLogs(); }
  catch (e) { toast(e.message, 'err'); }
}

/* ---------------- 设置 ---------------- */

RENDER.settings = async function () {
  const el = $('#tab-settings');
  try {
    const s = await api('/settings');
    el.innerHTML = `
      <div class="card"><h2>路由策略</h2>
        <div class="row">
          <div><label>策略</label><select id="st-strategy">
            <option value="balanced" ${s.strategy === 'balanced' ? 'selected' : ''}>balanced — 按剩余额度加权（推荐）</option>
            <option value="priority" ${s.strategy === 'priority' ? 'selected' : ''}>priority — 固定优先级，第一个能打就一直用</option>
            <option value="round_robin" ${s.strategy === 'round_robin' ? 'selected' : ''}>round_robin — 轮流用，平均消耗</option>
          </select></div>
          <div style="max-width:180px"><label>单请求最多尝试几个上游</label><input id="st-max" type="number" value="${s.max_attempts}"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div style="max-width:200px"><label>连续失败几次熔断</label><input id="st-th" type="number" value="${s.circuit_threshold}"></div>
          <div style="max-width:200px"><label>熔断冷却（秒）</label><input id="st-cool" type="number" value="${s.circuit_cooldown}"></div>
          <div style="max-width:240px"><label>额度巡检间隔（秒）</label><input id="st-q" type="number" value="${s.quota_check_interval}"></div>
          <div style="max-width:200px"><label>流式注入 include_usage</label>
            <select id="st-inject"><option value="1" ${s.inject_stream_usage ? 'selected' : ''}>开（能统计 token）</option><option value="0" ${!s.inject_stream_usage ? 'selected' : ''}>关</option></select></div>
        </div>
        <div style="margin-top:12px"><button class="primary" onclick="saveSettings()">保存设置</button></div>
      </div>
      <div class="card"><h2>修改控制台密码</h2>
        <div class="row">
          <div><label>原密码</label><input id="pw-old" type="password"></div>
          <div><label>新密码（≥6 位）</label><input id="pw-new" type="password"></div>
        </div>
        <div style="margin-top:12px"><button class="primary" onclick="changePw()">修改</button></div>
      </div>`;
  } catch (e) { el.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
};

async function saveSettings() {
  const payload = {
    strategy: $('#st-strategy').value, max_attempts: parseInt($('#st-max').value, 10),
    circuit_threshold: parseInt($('#st-th').value, 10), circuit_cooldown: parseInt($('#st-cool').value, 10),
    quota_check_interval: parseInt($('#st-q').value, 10), inject_stream_usage: $('#st-inject').value === '1'
  };
  try { await api('/settings', { method: 'PUT', body: JSON.stringify(payload) }); toast('已保存', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}

async function changePw() {
  try {
    await api('/password', { method: 'POST', body: JSON.stringify({ old_password: $('#pw-old').value, new_password: $('#pw-new').value }) });
    toast('密码已修改', 'ok'); $('#pw-old').value = ''; $('#pw-new').value = '';
  } catch (e) { toast(e.message, 'err'); }
}

/* ---------------- 启动 ---------------- */

(async function boot() {
  if (!TOKEN) { $('#login').hidden = false; return; }
  try {
    const me = await api('/me');
    $('#who').textContent = me.username; $('#app').hidden = false; switchTab('overview');
  } catch (e) { $('#login').hidden = false; }
})();
$('#lg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
